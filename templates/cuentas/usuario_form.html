{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">{{ titulo }}</h1>
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow mb-4">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6">
                            <h6 class="font-weight-bold text-aventura">Datos de la cuenta</h6>
                            {{ form }}
                        </div>
                        <div class="col-md-6">
                            <h6 class="font-weight-bold text-aventura">Perfil y rol</h6>
                            {{ perfil_form }}
                        </div>
                    </div>
                    <a href="{% url 'listar_usuarios' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-aventura">Guardar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

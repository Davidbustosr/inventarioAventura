{% extends 'base_login.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="text-center">
    <h1 class="h4 text-gray-900 mb-4">¡Bienvenido de vuelta!</h1>
</div>
<form class="user" method="post">
    {% csrf_token %}
    <div class="form-group">
        <input type="text" class="form-control form-control-user" name="username"
               placeholder="Nombre de usuario..." autofocus required>
    </div>
    <div class="form-group">
        <input type="password" class="form-control form-control-user" name="password"
               placeholder="Contraseña..." required>
    </div>
    <div class="form-group">
        <div class="custom-control custom-checkbox small">
            <input type="checkbox" class="custom-control-input" id="recordarme" name="recordarme" value="1">
            <label class="custom-control-label" for="recordarme">Recuérdame (mantener la sesión 2 horas)</label>
        </div>
    </div>
    <button class="btn btn-aventura btn-user btn-block" type="submit">Ingresar</button>
</form>
<hr>
<div class="text-center">
    <a class="small" href="{% url 'registro' %}">¿No tienes cuenta? ¡Regístrate como turista!</a>
</div>
<div class="text-center">
    <a class="small" href="{% url 'inicio' %}">Volver al inicio</a>
</div>
{% endblock %}

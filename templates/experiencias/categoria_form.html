{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">{{ titulo }}</h1>
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow mb-4">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form }}
                    <a href="{% url 'listar_categorias' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-aventura">Guardar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
